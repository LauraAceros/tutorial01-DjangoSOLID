upstream django_v1 {
    server web_django:8000; [cite: 106]
}

upstream flask_v2 {
    server pagos_flask:5000; [cite: 110]
}

server {
    listen 80; [cite: 120]

    # RUTA VIEJA: Sigue yendo a Django [cite: 121]
    location /api/v1/ {
        proxy_pass http://django_v1; [cite: 123]
        proxy_set_header Host $host; [cite: 124]
    }

    # RUTA NUEVA: Estrangulamos la funcion de compra y la mandamos a Flask [cite: 125]
    location /api/v2/comprar {
        proxy_pass http://flask_v2; [cite: 133]
        proxy_set_header Host $host; [cite: 134]
    }
}