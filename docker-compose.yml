version: '3.8'

services:
  web:
    build: .
    # Usamos Gunicorn y apuntamos a Tienda (la carpeta de tu proyecto)
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    # Ya no hay 'ports'. Expose solo lo abre para la red interna de Docker.
    expose:
      - "8000"
    env_file:
      - .env

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web